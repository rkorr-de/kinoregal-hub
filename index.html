<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>PLEX+ Hub</title>
<!-- Eigener Cast-Receiver für das "Wohnzimmer Display" (Nest Hub Max). Enthält keine Daten und keine Schlüssel:
     Titel, Cover und Dauer schickt Kinoregal beim Casten mit. Gespielt wird ein stilles Audio so lang wie der Film,
     so laufen Pause, Weiter und Spulen mit, und der Hub bleibt wach. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9ad55;--gold2:#f1cf86;--text:#f3f1ec;--dim:#8d8a84;--track:#1b1a18}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;background:#000;overflow:hidden;color:var(--text);
  font-family:"Google Sans Flex",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr;gap:5.5vw;padding:7vh 6vw 7.5vh 6vw;
  opacity:0;transition:opacity 1.2s ease}
.wrap.da{opacity:1}
.wrap.ohne-cover{grid-template-columns:1fr}
.ohne-cover .cover{display:none}
.cover{position:relative;height:86vh;aspect-ratio:2/3;align-self:center}
.cover .glow{position:absolute;inset:-6%;background:center/cover;filter:blur(40px) saturate(1.3);opacity:.38;border-radius:20px}
.cover img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:1.6vh;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2vh 6vh rgba(0,0,0,.8)}
.info{display:flex;flex-direction:column;min-width:0}
.clock{font-size:26vh;line-height:.82;font-weight:300;letter-spacing:-.035em;margin-left:-.05em}
.mid{margin-top:auto}
.label{font-size:1.9vh;font-weight:600;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.title{font-size:5.4vh;font-weight:500;line-height:1.12;margin-top:1.2vh;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:2.6vh;color:var(--dim);margin-top:.9vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub:empty{display:none}
.bar{position:relative;height:.7vh;background:var(--track);border-radius:1vh;margin-top:5vh}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:1vh;
  background:linear-gradient(90deg,#8a6420,var(--gold) 70%,var(--gold2));box-shadow:0 0 1.6vh rgba(217,173,85,.45)}
.bar .dot{position:absolute;top:50%;width:1.9vh;height:1.9vh;margin:-.95vh 0 0 -.95vh;border-radius:50%;
  background:var(--gold2);box-shadow:0 0 1.2vh .3vh rgba(241,207,134,.55)}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3.2vh}
.v{font-size:10.5vh;font-weight:400;line-height:.9;letter-spacing:-.02em;margin-top:1.2vh}
.v .u{font-size:3vh;color:var(--dim);margin-left:.6vh;letter-spacing:0}
.end{text-align:right}
.pause .fill{opacity:.55}
.pause .dot{background:var(--dim);box-shadow:none}
audio{display:none}
</style></head>
<body>
<audio id="ton"></audio>
<div class="wrap" id="w">
  <div class="cover"><div class="glow" id="g"></div><img id="c" alt=""></div>
  <div class="info">
    <div class="clock" id="uhr"></div>
    <div class="mid">
      <div class="label" id="lab"></div>
      <div class="title" id="t"></div>
      <div class="sub" id="s"></div>
      <div class="bar"><div class="fill" id="f"></div><div class="dot" id="d"></div></div>
      <div class="row">
        <div><div class="label">Noch</div><div class="v" id="r"></div></div>
        <div class="end"><div class="label">Ende</div><div class="v" id="e"></div></div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const zwei = n => String(n).padStart(2, '0');
const uhrzeit = d => `${zwei(d.getHours())}:${zwei(d.getMinutes())}`;
const ctx = cast.framework.CastReceiverContext.getInstance();
const pm = ctx.getPlayerManager();
pm.setMediaElement($('ton'));
let dauer = 0, geladen = false;

function zeigeTitel(media) {
  const md = (media && media.metadata) || {}, cd = (media && media.customData) || {};
  dauer = +cd.dauer || Math.max(0, (media && media.duration || 0) - 60);
  $('t').textContent = md.title || '';
  $('s').textContent = md.subtitle || '';
  const bild = (md.images && md.images[0] && md.images[0].url) || '';
  $('w').classList.toggle('ohne-cover', !bild);
  if (bild) {
    $('c').src = bild;
    $('g').style.backgroundImage = `url("${bild}")`;
  }
  $('c').onerror = () => $('w').classList.add('ohne-cover');
  geladen = true;
  $('w').classList.add('da');
}

function tick() {
  const jetzt = new Date();
  $('uhr').textContent = uhrzeit(jetzt);
  if (!geladen || !dauer) return;
  const pos = Math.min(dauer, pm.getCurrentTimeSec() || 0);
  const pause = pm.getPlayerState() === cast.framework.messages.PlayerState.PAUSED;
  const pct = pos / dauer * 100;
  $('f').style.width = pct + '%';
  $('d').style.left = pct + '%';
  const rest = Math.max(0, Math.round((dauer - pos) / 60)), h = Math.floor(rest / 60), m = rest % 60;
  $('r').innerHTML = h ? `${h}:${zwei(m)}<span class="u">Std.</span>` : `${m}<span class="u">Min.</span>`;
  $('e').innerHTML = `${uhrzeit(new Date(jetzt.getTime() + rest * 60000))}<span class="u">Uhr</span>`;
  $('lab').textContent = pause ? 'Pausiert' : 'Läuft';
  $('w').classList.toggle('pause', pause);
}

pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, req => { zeigeTitel(req.media); return req; });
pm.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => { geladen = false; $('w').classList.remove('da'); });
setInterval(tick, 1000);
tick();

const opt = new cast.framework.CastReceiverOptions();
opt.disableIdleTimeout = true;      // Anzeige bleibt, solange der Film läuft; Kinoregal beendet sie selbst
opt.skipPlayersLoad = false;
ctx.start(opt);
</script>
</body></html>
