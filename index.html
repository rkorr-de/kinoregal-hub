<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>PLEX+ Hub</title>
<!-- Eigener Cast-Receiver für das "Wohnzimmer Display" (Nest Hub Max). Enthält keine Daten und keine Schlüssel.
     Zwei Wege, gleiche Anzeige:
     1. TV-App (PLEX+ am Fernseher, ohne PC): Nachrichten im Namespace urn:x-cast:de.rkorr.plexplus,
        {"typ":"zeige","titel","untertitel","cover","dauer","position","spielt"} bzw. {"typ":"aus"}.
        Die Zeit zwischen den Meldungen rechnet die Seite selbst weiter.
        Musik: {"typ":"musik","sender","live","titel","interpret","album","jahr","sendung","ausgabe","seit_s",
        "cover","senderbild","senderfarbe"}; Bilder nur https oder data:, leere Felder fallen weg.
     2. PLEX+ am PC: Medien-LOAD mit stillem Audio so lang wie der Film und Titel, Cover und Dauer in den Metadaten. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9ad55;--gold2:#f1cf86;--text:#f3f1ec;--dim:#8d8a84;--track:#1b1a18}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;background:#000;overflow:hidden;color:var(--text);
  font-family:"Google Sans Flex",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr;gap:5.5vw;padding:7vh 6vw 7.5vh 6vw;
  opacity:0;transition:opacity 1.2s ease}
.wrap.da{opacity:1}
.wrap.ohne-cover{grid-template-columns:1fr}
.ohne-cover .cover{display:none}
.cover{position:relative;height:86vh;aspect-ratio:2/3;align-self:center}
.cover .glow{position:absolute;inset:-6%;background:center/cover;filter:blur(40px) saturate(1.3);opacity:.38;border-radius:20px}
.cover img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:1.6vh;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2vh 6vh rgba(0,0,0,.8)}
.info{display:flex;flex-direction:column;min-width:0}
.clock{font-size:26vh;line-height:.82;font-weight:300;letter-spacing:-.035em;margin-left:-.05em}
.mid{margin-top:auto}
.label{font-size:1.9vh;font-weight:600;letter-spacing:.24em;color:var(--gold);text-transform:uppercase}
.title{font-size:5.4vh;font-weight:500;line-height:1.12;margin-top:1.2vh;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:2.6vh;color:var(--dim);margin-top:.9vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub:empty{display:none}
.bar{position:relative;height:.7vh;background:var(--track);border-radius:1vh;margin-top:5vh}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:1vh;
  background:linear-gradient(90deg,#8a6420,var(--gold) 70%,var(--gold2));box-shadow:0 0 1.6vh rgba(217,173,85,.45)}
.bar .dot{position:absolute;top:50%;width:1.9vh;height:1.9vh;margin:-.95vh 0 0 -.95vh;border-radius:50%;
  background:var(--gold2);box-shadow:0 0 1.2vh .3vh rgba(241,207,134,.55)}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3.2vh}
.v{font-size:10.5vh;font-weight:400;line-height:.9;letter-spacing:-.02em;margin-top:1.2vh}
.v .u{font-size:3vh;color:var(--dim);margin-left:.6vh;letter-spacing:0}
.end{text-align:right}
.pause .fill{opacity:.55}
.pause .dot{background:var(--dim);box-shadow:none}
/* Musik: Cover mit Spiegelung links, Uhr und Titel rechts */
.musik{grid-template-columns:36vw 1fr;gap:5.3vw;padding:7vh 6vw 4.5vh 6.1vw}
.mcover{position:relative;width:36vw;aspect-ratio:1;align-self:center;margin-top:-7.5vh;border-radius:2vh;
  -webkit-box-reflect:below 1vh linear-gradient(transparent 62%,rgba(255,255,255,.22))}
.mcover .glow{position:absolute;inset:-5%;background:center/cover;filter:blur(44px) saturate(1.2);opacity:.3;border-radius:3vh}
.mcover img,.mcover .karte{position:relative;width:100%;height:100%;object-fit:cover;border-radius:2vh;display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 2vh 6vh rgba(0,0,0,.8)}
.mcover .karte{display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 3.6vh 2.85vw;
  background:linear-gradient(180deg,var(--sf,#2b4a9a),#1a1a24);overflow:hidden}
.karte .kn{font-size:3.8vh;font-weight:700;letter-spacing:.005em;text-transform:uppercase;line-height:1.1}
.karte .ks{font-size:2.6vh;font-weight:400;opacity:.85;margin-top:.3vh}
.mcover.mit-bild .karte,.mcover.ohne-bild img{display:none}
.musik .clock{font-size:22vh;margin-top:1vh}
.musik .label{letter-spacing:.1em;font-weight:700}
.mrow .end{margin-left:auto}
.punkt{display:inline-block;width:1.4vh;height:1.4vh;border-radius:50%;background:#e8483b;margin-right:1vh;vertical-align:.05em;
  box-shadow:0 0 1vh rgba(232,72,59,.6)}
.mtitel{font-size:5.4vh;font-weight:500;line-height:1.12;margin-top:1.4vh;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mint{font-size:4vh;font-weight:300;margin-top:.6vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.malb{font-size:2.6vh;color:var(--dim);margin-top:.8vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlinie{height:1px;background:#2a2926;margin-top:4vh}
.mrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3vh}
.mv{font-size:4vh;font-weight:300;margin-top:.5vh;white-space:nowrap}
.msend{font-size:2.6vh;color:var(--dim);margin-top:5vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mint:empty,.malb:empty,.msend:empty,.mrow .leer{display:none}
audio{display:none}
touch-controls{display:none !important}
</style></head>
<body>
<audio id="ton"></audio>
<div class="wrap" id="w">
  <div class="cover"><div class="glow" id="g"></div><img id="c" alt=""></div>
  <div class="info">
    <div class="clock" id="uhr"></div>
    <div class="mid">
      <div class="label" id="lab"></div>
      <div class="title" id="t"></div>
      <div class="sub" id="s"></div>
      <div class="bar"><div class="fill" id="f"></div><div class="dot" id="d"></div></div>
      <div class="row">
        <div><div class="label">Noch</div><div class="v" id="r"></div></div>
        <div class="end"><div class="label">Ende</div><div class="v" id="e"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="wrap musik" id="m">
  <div class="mcover ohne-bild" id="mc"><div class="glow" id="mg"></div><img id="mi" alt="">
    <div class="karte" id="mk"><div class="kn" id="mkn"></div><div class="ks" id="mks"></div></div></div>
  <div class="info">
    <div class="clock" id="muhr"></div>
    <div class="mid">
      <div class="label" id="mlab"></div>
      <div class="mtitel" id="mt"></div>
      <div class="mint" id="mn"></div>
      <div class="malb" id="ma"></div>
      <div class="mlinie"></div>
      <div class="mrow">
        <div id="mausw"><div class="label">Ausgabe</div><div class="mv" id="mau"></div></div>
        <div class="end" id="mseitw"><div class="label">Seit</div><div class="mv" id="mse"></div></div>
      </div>
      <div class="msend" id="msd"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const zwei = n => String(n).padStart(2, '0');
const uhrzeit = d => `${zwei(d.getHours())}:${zwei(d.getMinutes())}`;
const ctx = cast.framework.CastReceiverContext.getInstance();
const pm = ctx.getPlayerManager();
pm.setMediaElement($('ton'));
const NS = 'urn:x-cast:de.rkorr.plexplus';
const S = cast.framework.messages.PlayerState;
let dauer = 0, geladen = false;
// tv: Anzeige direkt von der TV-App (eigener Namespace), sonst Medien-LOAD von PLEX+ am PC
let tv = null, endeTimer = 0, senderWegTimer = 0;
// musik: Musikansicht (Radio/Musik aus der TV-App), {seit, empfangen}
let musik = null;

function zeigeTitel(titel, untertitel, bild) {
  musikWeg();
  $('t').textContent = titel || '';
  $('s').textContent = untertitel || '';
  $('w').classList.toggle('ohne-cover', !bild);
  if (bild && $('c').getAttribute('src') !== bild) {
    $('c').src = bild;
    $('g').style.backgroundImage = `url("${bild}")`;
  }
  $('c').onerror = () => $('w').classList.add('ohne-cover');
  geladen = true;
  $('w').classList.add('da');
}

function zeigeMedia(media) {
  const md = (media && media.metadata) || {}, cd = (media && media.customData) || {};
  tv = null;
  clearTimeout(endeTimer);
  dauer = +cd.dauer || Math.max(0, (media && media.duration || 0) - 60);
  zeigeTitel(md.title, md.subtitle, (md.images && md.images[0] && md.images[0].url) || '');
}

// Nach dem Ende der TV-Anzeige den Hub nach 3 min freigeben, falls die TV-App das nicht mehr kann (Strom weg)
function planeEnde() {
  clearTimeout(endeTimer);
  endeTimer = setTimeout(() => { if (!tv && !musik && pm.getPlayerState() === S.IDLE) ctx.stop(); }, 3 * 60000);
}

function tvAus() {
  tv = null;
  geladen = false;
  $('w').classList.remove('da');
  planeEnde();
}

function musikWeg() {
  musik = null;
  $('m').classList.remove('da');
}

function setzeBild(img, glow, url) {
  if (img.getAttribute('src') !== url) img.src = url;
  glow.style.backgroundImage = `url("${url}")`;
}

// Musik: Sender, Titel, Interpret, Album · Jahr, Ausgabe, seit wann, Sendung; leere Felder fallen weg
function zeigeMusik(m) {
  tv = null;
  geladen = false;
  $('w').classList.remove('da');
  clearTimeout(endeTimer);
  clearTimeout(senderWegTimer);
  musik = { seit: +m.seit_s || 0, empfangen: Date.now() };
  const lab = $('mlab');
  lab.textContent = '';
  if (m.live) {
    const p = document.createElement('span');
    p.className = 'punkt';
    lab.append(p, 'Live' + (m.sender ? ' · ' : ''));
  }
  lab.append(m.sender || '');
  $('mt').textContent = m.titel || m.sendung || m.sender || '';
  $('mn').textContent = m.interpret || '';
  $('ma').textContent = [m.album, +m.jahr > 0 ? m.jahr : ''].filter(Boolean).join('  ·  ');
  $('mau').textContent = m.ausgabe || '';
  $('mausw').classList.toggle('leer', !m.ausgabe);
  $('msd').textContent = m.titel && m.sendung ? m.sendung : '';
  const bild = m.cover || m.senderbild || '', mc = $('mc');
  mc.classList.toggle('mit-bild', !!bild);
  mc.classList.toggle('ohne-bild', !bild);
  if (bild) setzeBild($('mi'), $('mg'), bild);
  else $('mg').style.backgroundImage = '';
  $('mi').onerror = () => { mc.classList.remove('mit-bild'); mc.classList.add('ohne-bild'); $('mg').style.backgroundImage = ''; };
  mc.style.setProperty('--sf', /^#[0-9a-f]{3,8}$/i.test(m.senderfarbe || '') ? m.senderfarbe : '#2b4a9a');
  $('mkn').textContent = m.sender || '';
  $('mks').textContent = m.sendung || '';
  $('m').classList.add('da');
  zeichneMusik();
}

function zeichneMusik() {
  const min = Math.max(1, Math.floor((musik.seit + (Date.now() - musik.empfangen) / 1000) / 60)), h = Math.floor(min / 60);
  $('mse').textContent = h ? `${h}:${zwei(min % 60)} Std.` : `${min} Min.`;
}

function tvNachricht(m) {
  if (!m || m.typ === 'aus') { musikWeg(); return tvAus(); }
  if (m.typ === 'musik') return zeigeMusik(m);
  if (m.typ !== 'zeige') return;
  if (m.typ !== 'zeige') return;
  clearTimeout(endeTimer);
  clearTimeout(senderWegTimer);
  tv = { position: +m.position || 0, spielt: !!m.spielt, seit: Date.now() };
  dauer = +m.dauer || 0;
  zeigeTitel(m.titel, m.untertitel, m.cover || '');
}

function zeichne(pos, pause, jetzt) {
  pos = Math.min(dauer, Math.max(0, pos));
  const pct = pos / dauer * 100;
  $('f').style.width = pct + '%';
  $('d').style.left = pct + '%';
  const rest = Math.max(0, Math.round((dauer - pos) / 60)), h = Math.floor(rest / 60), m = rest % 60;
  $('r').innerHTML = h ? `${h}:${zwei(m)}<span class="u">Std.</span>` : `${m}<span class="u">Min.</span>`;
  $('e').innerHTML = `${uhrzeit(new Date(jetzt.getTime() + rest * 60000))}<span class="u">Uhr</span>`;
  $('lab').textContent = pause ? 'Pausiert' : 'Läuft';
  $('w').classList.toggle('pause', pause);
}

let leerSeit = 0;
function tick() {
  const jetzt = new Date();
  $('uhr').textContent = $('muhr').textContent = uhrzeit(jetzt);
  if (musik) {
    // Die TV-App meldet sich bei jedem Titelwechsel und alle 5 min; 12 min Stille = weg
    if (Date.now() - musik.empfangen > 12 * 60000) { musikWeg(); return tvAus(); }
    return zeichneMusik();
  }
  if (tv) {
    // Die TV-App meldet sich beim Abspielen alle 15 s; bleibt das aus, ist sie weg. Pause gilt höchstens 30 min.
    const still = Date.now() - tv.seit;
    if (still > (tv.spielt ? 120000 : 31 * 60000)) return tvAus();
    const pos = tv.position + (tv.spielt ? still / 1000 : 0);
    if (dauer && tv.spielt && pos > dauer + 60) return tvAus();
    $('w').classList.add('da');
    if (dauer) zeichne(pos, !tv.spielt, jetzt);
    return;
  }
  if (!geladen || !dauer) return;
  if (pm.getPlayerState() === S.IDLE) {   // gestoppt: Anzeige ausblenden
    if (!leerSeit) leerSeit = Date.now();
    if (Date.now() - leerSeit > 5000) $('w').classList.remove('da');
    return;
  }
  leerSeit = 0;
  $('w').classList.add('da');
  zeichne(pm.getCurrentTimeSec() || 0, pm.getPlayerState() === S.PAUSED, jetzt);
}

pm.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, req => { zeigeMedia(req.media); return req; });
pm.addEventListener(cast.framework.events.EventType.MEDIA_FINISHED, () => { if (!tv) { geladen = false; $('w').classList.remove('da'); } });
ctx.addCustomMessageListener(NS, e => tvNachricht(typeof e.data === 'string' ? JSON.parse(e.data) : e.data));
// TV-App weg (WLAN, Fernseher aus): nach 60 s ohne neue Meldung ausblenden
ctx.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, () => {
  if ((!tv && !musik) || ctx.getSenders().length) return;
  clearTimeout(senderWegTimer);
  const seit = tv ? tv.seit : musik.empfangen;
  senderWegTimer = setTimeout(() => {
    if (tv && tv.seit === seit) tvAus();
    if (musik && musik.empfangen === seit) { musikWeg(); tvAus(); }
  }, 60000);
});
setInterval(tick, 1000);
tick();

const opt = new cast.framework.CastReceiverOptions();
opt.disableIdleTimeout = true;      // Anzeige bleibt, solange der Film läuft; PLEX+ beendet sie selbst
opt.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
opt.skipPlayersLoad = false;
opt.touchScreenOptimizedApp = true; // keine Google-Touchsteuerung über der Anzeige (Nest Hub)
ctx.start(opt);
</script>
</body></html>
